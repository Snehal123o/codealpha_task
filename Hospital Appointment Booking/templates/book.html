
<div class="card auth-box" style="max-width:500px;">
  <h2>Book with Dr. {{ doctor.full_name }}</h2>
  <p class="text-muted">{{ doctor.department }} | Fee: ₹{{ doctor.consultation_fee }}</p>
  <p class="text-muted" style="margin-bottom:16px;">Available: {{ doctor.available_days }} | {{ doctor.available_time }}</p>

  <form method="POST">
    <div class="form-group">
      <label>Date</label>
      <input type="date" name="date" required>
    </div>
    <div class="form-group">
      <label>Time Slot</label>
      <select name="time_slot" required>
        
          <option value="{{ slot }}">{{ slot }}</option>
       
      </select>
    </div>
    <div class="form-group">
      <label>Reason for visit</label>
      <textarea name="reason" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-full">Confirm Booking</button>
  </form>
</div>
