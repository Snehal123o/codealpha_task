
<h2>All Appointments</h2>

<form method="GET" style="margin:16px 0;">
  <select name="status" onchange="this.form.submit()" style="padding:8px; border-radius:6px;">
    <option value="">All Statuses</option>
    
      <option value="{{ s }}" {% if selected_status == s %}selected{% endif %}>{{ s|capitalize }}</option>
    
  </select>
</form>

<table>
  <thead>
    <tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Reason</th><th>Status</th></tr>
  </thead>
  <tbody>
 
      <tr>
        <td>{{ appt.patient_name }}</td>
        <td>Dr. {{ appt.doctor_name }}</td>
        <td>{{ appt.appointment_date }}</td>
        <td>{{ appt.time_slot }}</td>
        <td>{{ appt.reason or '-' }}</td>
        <td><span class="status-{{ appt.status }}">{{ appt.status|capitalize }}</span></td>
      </tr>
    
      <tr><td colspan="6" class="text-center text-muted">No appointments found.</td></tr>
   
  </tbody>
</table>
