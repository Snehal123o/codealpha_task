
<div class="card" style="max-width:550px;">
  <h2>Add New Doctor</h2>
  <form method="POST">
    <div class="form-group"><label>Full Name</label><input type="text" name="full_name" required></div>
    <div class="form-group"><label>Username (for login)</label><input type="text" name="username" required></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
    <div class="form-group"><label>Department</label><input type="text" name="department" required></div>
    <div class="form-group"><label>Specialization</label><input type="text" name="specialization" required></div>
    <div class="form-group"><label>Qualification</label><input type="text" name="qualification"></div>
    <div class="form-group"><label>Experience (years)</label><input type="number" name="experience_years" min="0" value="0"></div>
    <div class="form-group"><label>Consultation Fee</label><input type="number" name="consultation_fee" min="0" step="0.01" value="0"></div>
    <div class="form-group"><label>Available Days</label><input type="text" name="available_days" placeholder="Mon,Wed,Fri"></div>
    <div class="form-group"><label>Available Time</label><input type="text" name="available_time" placeholder="10:00 AM - 4:00 PM"></div>
    <button type="submit" class="btn btn-full">Save Doctor</button>
  </form>
</div>
